<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>留学先条件検索</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap" rel="stylesheet" />

<style>
  body {
    font-family: 'Noto Sans JP', 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffffffff, #ffffffff);
    margin: 0;
    padding: 0;
  }

  .form-container {
    max-width: 700px;
    margin: 2rem auto;
    padding: 1.5rem 1.5rem 2rem;
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  label {
    font-weight: 700;
    display: block;
    margin-top: 1.3rem;
    font-size: 1rem;
    color: #333;
  }

  select {
    width: 100%;
    padding: 0.6rem 1rem;
    margin-top: 0.4rem;
    border-radius: 12px;
    border: 2px solid #5a8dee;
    font-size: 1rem;
    background: white;
    appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, #5a8dee 50%),
      linear-gradient(135deg, #5a8dee 50%, transparent 50%);
    background-position:
      calc(100% - 20px) calc(1em + 2px),
      calc(100% - 15px) calc(1em + 2px);
    background-size: 5px 5px;
    background-repeat: no-repeat;
    cursor: pointer;
  }
  select:focus {
    outline: none;
    border-color: #4178d4;
    box-shadow: 0 0 5px #4178d4aa;
  }

  button {
    margin-top: 2rem;
    width: 100%;
    padding: 0.85rem 0;
    font-size: 1.1rem;
    border: none;
    border-radius: 50px;
    background: linear-gradient(90deg, #00a2ffff, #0911eeff);
    color: white;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.3s ease;
  }
  button:hover {
    transform: scale(1.05);
  }

  /* 結果画面のレイアウト */
  #result-screen {
    display: none; 
    box-sizing: border-box;
    min-height: 100vh;
    background: #fff;
    transition: opacity 0.5s ease;
    opacity: 0; 
  }

  #result-screen.show {
    display: flex; 
    flex-direction: column;
    align-items: center;
    padding: 0 20vw;
    opacity: 1;
  }

  .result-title {
    color: #1E90FF;
    font-size: 1.8em;
    font-weight: bold;
    text-align: center;
    margin-bottom: 20px;
    width: 100%;
  }
  .no-result {
    color: #1E90FF;
    font-size: 1.5em;
    font-weight: 700;
    text-align: center;
    margin-bottom: 12px;
    width: 100%;
  }
  .recommend-title {
    background: linear-gradient(90deg, #5f7fffff, #7b8cfeff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 1.4em;
    font-weight: 700;
    text-align: center;
    margin-bottom: 16px;
    width: 100%;
  }

.card-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* PCは3列 */
  gap: 1.5rem;
  width: 100%;
  padding: 1rem 0;
  justify-items: center;
  box-sizing: border-box;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.card-container.show {
  opacity: 1;
  transform: translateY(0);
}

.card {
  width: 100%;
  max-width: 260px; /* 3列でも十分大きく見える */
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.15);
  text-align: center;
  text-decoration: none;
  color: #333;
  overflow: hidden;
  transform: scale(0.95);
  transition: transform 0.4s cubic-bezier(0.25, 1.25, 0.5, 1), box-shadow 0.3s;
}

.card:hover {
  transform: scale(1.05) translateY(-5px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.2);
}

.card img {
  width: 100%;
  height: 160px; /* 少し大きめで見栄え良く */
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
}

.card:hover img {
  transform: scale(1.1);
}

.card h3 {
  margin: 0.5rem 0 1rem 0;
  font-size: 0.9rem; /* 少し控えめ */
  color:#333;
}

/* 共通のチップスタイル */
.chip {
  display: inline-block;
  margin: 0.3rem;
  cursor: pointer;
}

.chip input[type="checkbox"] {
  display: none; /* チェックボックスは隠す */
}

.chip span {
  display: inline-block;
  padding: 0.45rem 1rem;
  font-size: 0.72rem;
  border-radius: 999px; /* pill型 */
  border: 1.8px solid #5a8dee;
  background: #fff;
  color: #5a8dee;
  font-weight: 500;
  transition: all 0.25s ease;
}

/* hover時 */
.chip:hover span {
  background: #eef4ff;
}

/* 選択状態 */
.chip input[type="checkbox"]:checked + span {
  background: #5a8dee;
  color: #fff;
  box-shadow: 0 3px 8px rgba(90, 141, 238, 0.35);
}

/* レスポンシブ: スマホは2列に */
@media screen and (max-width: 768px) {
  .card-container {
    grid-template-columns: repeat(2, 1fr);
  }

  .card img {
    height: 140px; /* スマホ用に少し小さく */
  }

  .card h3 {
    font-size: 0.95rem; /* スマホ用に少し小さめ */
  }
}


  .back-btn {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 1em;
    background-color: #1E90FF;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    width: auto;
    align-self: center;
    transition: background-color 0.3s ease;
  }
  .back-btn:hover {
    background-color: #145ea8;
  }
  input[type="checkbox"] {
    transform: scale(1.5); 
    margin-right: 6px;
    cursor: pointer; 
    accent-color: #0078d7;
  }
  #strength-options input[type="checkbox"] {
    transform: scale(1.3); 
    margin-right: 5px;
    cursor: pointer;
  }

  #strength-options label {
    display: inline-flex; 
    align-items: center; 
    margin-bottom: 5px; 
  }


  #country-container {
    display: none;
  }

  .error-msg {
  color: red;
  font-size: 0.85rem;
  margin-top: 4px;
  display: none; /* 初期は非表示 */
}

</style>
</head>

function showCountrySelect() {
  const region = document.getElementById("region").value;

    document.getElementById("country-container").style.display = "block";
    countrySelect.innerHTML = '<option value="" selected>選択してください</option>';

      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });
  } else {
    document.getElementById("country-container").style.display = "none";
  }
}

function shuffleArray(arr) {
  let array = arr.slice();
  for (let i = array.length -1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

document.addEventListener("DOMContentLoaded", () => {
  // 地域選択に応じて国リスト更新
  const regionOptions = document.querySelectorAll(".region");
  regionOptions.forEach(cb => {
    cb.addEventListener("change", updateCountryOptions);
  });
});

document.addEventListener("DOMContentLoaded", () => {
  // 地域選択に応じて国リスト更新
  const regionOptions = document.querySelectorAll(".region");
  regionOptions.forEach(cb => {
    cb.addEventListener("change", updateCountryOptions);
  });
});

function updateCountryOptions() {
  const countryContainer = document.getElementById("country-container");
  const countryOptions = document.getElementById("country-options");

  const selectedRegions = Array.from(document.querySelectorAll(".region:checked"))
                              .map(cb => cb.value);

  // 現在選択されている国を保存
  const previouslySelected = Array.from(
    document.querySelectorAll(".country:checked")
  ).map(cb => cb.value);

  // 国リストをリセット
  countryOptions.innerHTML = "";

  // 地域が未選択 → 国選択UIを隠す
  if (selectedRegions.length === 0) {
    countryContainer.style.display = "none";
    return;
  }

  // 地域が選択されている → 国選択UIを表示
  countryContainer.style.display = "block";

  let countries = [];
  selectedRegions.forEach(region => {
    if (countriesByRegion[region]) {
      countries = countries.concat(countriesByRegion[region]);
    }
  });

  // 国リストを描画（必要に応じて選択状態を復元）
  countries.forEach(c => {
    const label = document.createElement("label");
    label.className = "chip";

    const input = document.createElement("input");
    input.type = "checkbox";
    input.className = "country";
    input.value = c;

    // 過去に選択されていて、かつ有効な国ならチェック復元
    if (previouslySelected.includes(c)) {
      input.checked = true;
    }

    const span = document.createElement("span");
    span.textContent = c;

    label.appendChild(input);
    label.appendChild(span);
    countryOptions.appendChild(label);
  });
}


function searchUniversities() {
  let valid = true;

  // すべてのエラーメッセージをリセット
  document.querySelectorAll(".error-msg").forEach(e => {
    e.style.display = "none";
    e.textContent = "";
  });

  const grade = document.getElementById("grade").value;
  const selectedRegions = Array.from(document.querySelectorAll(".region:checked")).map(cb => cb.value);
  const selectedCountries = Array.from(document.querySelectorAll(".country:checked")).map(cb => cb.value);
  const selectedStrengths = Array.from(document.querySelectorAll(".strength:checked")).map(cb => cb.value);

  // 所属課程
  if (grade === "") {
    document.getElementById("grade-error").textContent = "所属課程が未入力です";
    document.getElementById("grade-error").style.display = "block";
    valid = false;
  }

  // 地域
  if (selectedRegions.length === 0) {
    document.getElementById("region-error").textContent = "一つ以上の地域を選択してください";
    document.getElementById("region-error").style.display = "block";
    valid = false;
  }

  // 国
  if (document.getElementById("country-container").style.display !== "none" && selectedCountries.length === 0) {
    document.getElementById("country-error").textContent = "一つ以上の国を選択してください";
    document.getElementById("country-error").style.display = "block";
    valid = false;
  }

  // 強み
  if (selectedStrengths.length === 0) {
    document.getElementById("strength-error").textContent = "一つ以上の強みを選択してください";
    document.getElementById("strength-error").style.display = "block";
    valid = false;
  }

  // 入力エラーがある場合 → 結果画面に遷移しない
  if (!valid) return;

  // フィルタリング処理（既存のロジック）
  const filtered = universities.filter(u => {
    const gradeMatch = grade === "" || (Array.isArray(u.grade) ? u.grade.includes(grade) : u.grade === grade);
    const regionMatch = selectedRegions.length === 0 || selectedRegions.includes(u.region);
    const countryMatch = selectedCountries.length === 0 || selectedCountries.includes(u.country);
    const strengthMatch = selectedStrengths.length === 0 || selectedStrengths.some(str => u.strengths.includes(str));
    return gradeMatch && regionMatch && countryMatch && strengthMatch;
  });

  showResults(filtered, universities);
}

function showResults(filtered, universities) {
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  if (filtered.length > 0) {
    const title = document.createElement("div");
    title.className = "result-title";
    title.textContent = "あなたにぴったりの大学が見つかりました！";
    resultsDiv.appendChild(title);

    const cardContainer = document.createElement("div");
    cardContainer.className = "card-container";

    filtered.forEach(u => {
      const card = document.createElement("a");
      card.href = u.url;
      card.target = "_blank";
      card.rel = "noopener noreferrer";
      card.className = "card";
      card.innerHTML = `
        <img src="${u.img}" alt="${u.name}">
        <h3>${u.name}</h3>
      `;
      cardContainer.appendChild(card);
    });

    resultsDiv.appendChild(cardContainer);
    // フェードインアニメーション
    setTimeout(() => cardContainer.classList.add("show"), 50);

  } else {
    const noResultText = document.createElement("div");
    noResultText.className = "no-result";
    noResultText.textContent = "条件を満たす大学が見つかりませんでした。";
    resultsDiv.appendChild(noResultText);

    const recommendText = document.createElement("div");
    recommendText.className = "recommend-title";
    recommendText.textContent = "こちらの大学もおすすめです";
    resultsDiv.appendChild(recommendText);

    const shuffled = shuffleArray(universities);
    const recommendUniversities = shuffled.slice(0,6);

    const cardContainer = document.createElement("div");
    cardContainer.className = "card-container";

    recommendUniversities.forEach(u => {
      const card = document.createElement("a");
      card.href = u.url;
      card.target = "_blank";
      card.rel = "noopener noreferrer";
      card.className = "card";
      card.innerHTML = `
        <img src="${u.img}" alt="${u.name}">
        <h3>${u.name}</h3>
      `;
      cardContainer.appendChild(card);
    });

    resultsDiv.appendChild(cardContainer);
    setTimeout(() => cardContainer.classList.add("show"), 50);
  }

  const backBtn = document.createElement("button");
  backBtn.className = "back-btn";
  backBtn.textContent = "戻る";
  backBtn.onclick = () => {
    document.getElementById("result-screen").classList.remove("show");
    document.getElementById("search-screen").style.display = "block";
  };
  resultsDiv.appendChild(backBtn);

  document.getElementById("search-screen").style.display = "none";
  document.getElementById("result-screen").classList.add("show");
}
